<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Payment - Surovi Monipuri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bkash: #e2136e; --nagad: #f7941d; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .payment-container { width: 100%; max-width: 400px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .pay-header { padding: 15px; border-bottom: 1px solid #ddd; display: flex; align-items: center; background: white; position: sticky; top: 0; z-index: 10; }
        .back-btn { font-size: 20px; color: #65676b; cursor: pointer; text-decoration: none; margin-right: 15px; }
        .pay-header h3 { margin: 0; flex: 1; text-align: center; font-size: 18px; color: #050505; }
        .method-tabs { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .tab-btn { background: white; padding: 8px; border-radius: 12px; border: 2px solid #eee; width: 90px; cursor: pointer; transition: 0.3s; }
        .tab-btn img { width: 100%; border-radius: 8px; display: block; }
        .tab-btn.active { border-color: var(--bkash); box-shadow: 0 4px 10px rgba(226, 19, 110, 0.2); }
        .tab-btn.nagad-active { border-color: var(--nagad); box-shadow: 0 4px 10px rgba(247, 148, 29, 0.2); }
        .pay-details-card { margin: 0 15px; padding: 20px; border-radius: 15px; color: white; background: var(--bkash); transition: 0.3s; }
        .pay-details-card.nagad-bg { background: var(--nagad); }
        #method-title { font-weight: bold; color: red; background: white; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px; font-size: 14px; }
        .inst-text { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
        .number-box { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .number-box h2 { margin: 0; font-size: 22px; letter-spacing: 1px; font-weight: bold; }
        .copy-btn { background: white; color: black; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 13px; }
        .amount-info { margin-top: 15px; font-size: 16px; }
        .amount-info b { font-size: 20px; }
        .input-section { padding: 20px 15px; width: 100%; }
        .txn-input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; display: block; }
        .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #27ae60; color: white; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .footer-note { text-align: center; color: #65676b; font-size: 13px; padding: 20px; line-height: 1.4; }
    </style>
</head>
<body class="notranslate">

    <div class="payment-container">
        <div class="pay-header">
            <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h3>পেমেন্ট মেথড নিশ্চিত করুন</h3>
        </div>

        <div class="method-tabs">
            <div class="tab-btn active" id="b-tab" onclick="switchMethod('bkash')">
                <img src="https://github.com/pj9889/fffff/blob/main/bksh.png?raw=true" alt="bKash">
            </div>
            <div class="tab-btn" id="n-tab" onclick="switchMethod('nagad')">
                <img src="https://github.com/pj9889/nagad/raw/refs/heads/main/nagas.jfif" alt="Nagad">
            </div>
        </div>

        <div id="details-card" class="pay-details-card">
            <div id="method-title">বিকাশ পার্সোনাল</div>
            <div class="inst-text">নিচের নাম্বারে <b>Send Money</b> করুন:</div>
            <div class="number-box">
                <h2 id="pay-num">01625575447</h2>
                <button class="copy-btn" onclick="copyNumber()">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>
            <div class="amount-info">টাকার পরিমাণ: <b id="display-amt">১৫০ টাকা</b></div>
        </div>

        <div class="input-section">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #444;">ট্রানজেকশন আইডি (TrxID)</label>
            <input type="text" id="txn-id" class="txn-input" placeholder="ট্রানজেকশন আইডি দিন" autocomplete="off">
            <button class="submit-btn" id="confirmBtn">পেমেন্ট নিশ্চিত করুন</button>
        </div>

        <div class="footer-note">পেমেন্ট সম্পন্ন হওয়ার পর ট্রানজেকশন আইডি দিয়ে সাবমিট করুন।</div>
    </div>

    <script>
        // --- 1. GOOGLE SCRIPT URL ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQadM-mg1kUPDXi-HygugyicETLV8n3ldFulJ4oslEfPlAie7rX2YbmypFwOIpiH1UHw/exec"; 

        // Tracking Function
        function trackAction(action) {
            if (SCRIPT_URL !== "APNAR_GOOGLE_SCRIPT_URL_EKHANE") {
                fetch(SCRIPT_URL + "?action=" + action, { mode: 'no-cors' }).catch(e => console.log("error"));
            }
        }

        // Load Amount and Track Visitor
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const amt = urlParams.get('amt') || '১৫০';
            document.getElementById('display-amt').innerText = amt + " টাকা";
            trackAction('visitor');
        };

        function switchMethod(method) {
            const card = document.getElementById('details-card');
            const bTab = document.getElementById('b-tab');
            const nTab = document.getElementById('n-tab');
            const title = document.getElementById('method-title');
            const input = document.getElementById('txn-id');

            if (method === 'nagad') {
                card.classList.add('nagad-bg');
                nTab.classList.add('nagad-active');
                bTab.classList.remove('active');
                title.innerText = "নগদ পার্সোনাল";
                trackAction('nagad');
            } else {
                card.classList.remove('nagad-bg');
                bTab.classList.add('active');
                nTab.classList.remove('nagad-active');
                title.innerText = "বিকাশ পার্সোনাল";
            }
        }

        function copyNumber() {
            const num = document.getElementById('pay-num').innerText;
            navigator.clipboard.writeText(num);
            const btn = document.querySelector('.copy-btn');
            btn.innerHTML = '<i class="fas fa-check"></i> Copied';
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            }, 2000);
        }

        document.getElementById('confirmBtn').addEventListener('click', function() {
            const trx = document.getElementById('txn-id').value.trim();
            if (trx.length < 6) {
                alert("সঠিক ট্রানজেকশন আইডি দিন!");
                return;
            }
            
            trackAction('payment');
            
            alert("পেমেন্ট ভেরিফাই করা হচ্ছে...");
            setTimeout(() => {
                window.location.href = "https://safeoffers.pro/a/1rypFXB3uXm3P";
            }, 1500);
        });
    </script>
</body>
</html>
